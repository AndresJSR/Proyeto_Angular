<div class="mapa-toolbar">
  <button mat-stroked-button (click)="setMode('mapa')" [color]="mode() === 'mapa' ? 'primary' : ''">
    Mapa
  </button>
  <button mat-stroked-button (click)="setMode('demarcacion')" [color]="mode() === 'demarcacion' ? 'primary' : ''">
    Demarcación
  </button>
  <button mat-stroked-button (click)="setMode('tracking')" [color]="mode() === 'tracking' ? 'primary' : ''">
    Tiempo Real
  </button>
</div>

<div class="mapa-layout">
  <aside class="panel-izq">
    @if (mode() === 'tracking') {
      <app-tracking-panel (officialsUpdate)="onOfficialsUpdate($event)" />
    } @else if (mode() === 'demarcacion') {
      <app-demarcacion-panel
        #demarcacionPanelRef
        (barrioSeleccionado)="onBarrioSeleccionado($event)"
        (guardado)="recargarPoligono()" />
      @if (barrioActivo()) {
        <div class="flex gap-2 mt-2">
          <button mat-stroked-button color="warn" class="flex-1"
            (click)="drawCoords.set([]); clearDrawLayers()">
            Limpiar
          </button>
          <button mat-flat-button color="primary" class="flex-1"
            (click)="savePolygon()"
            [disabled]="demarcacionPanel()?.saving() || drawCoords().length < 3">
            {{ demarcacionPanel()?.saving() ? 'Guardando...' : 'Guardar' }}
          </button>
        </div>
      }
    } @else {
      <app-filtros-panel />
    }
  </aside>

  <main class="mapa-centro">
    <div id="map"></div>

    @if (showForm()) {
      <div class="form-overlay">
        <app-anotacion-form
          [coords]="formCoords()"
          (closed)="showForm.set(false)"
          (saved)="showForm.set(false)" />
      </div>
    }

    @if (loading()) {
      <div class="mapa-loading">Cargando anotaciones...</div>
    }

    @if (!filtered().length && !loading()) {
      <div class="mapa-empty">No hay anotaciones para los filtros seleccionados</div>
    }
  </main>

  <aside class="panel-der">
    <app-anotacion-detalle [annotation]="selected()" />
  </aside>
</div>
