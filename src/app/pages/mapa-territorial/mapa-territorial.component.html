<div class="mapa-toolbar">
  <button mat-stroked-button (click)="setMode('mapa')" [color]="mode() === 'mapa' ? 'primary' : ''">
    Mapa
  </button>
  <button mat-stroked-button (click)="setMode('demarcacion')" [color]="mode() === 'demarcacion' ? 'primary' : ''">
    Demarcación
  </button>
</div>

<div class="mapa-layout">
  <aside class="panel-izq">
    @if (mode() === 'demarcacion') {
      <app-demarcacion-panel
        #demarcacionPanel
        (barrioSeleccionado)="onBarrioSeleccionado($event)"
        (guardado)="recargarPoligono()" />
      @if (barrioActivo()) {
        <button mat-flat-button color="primary" class="w-full mt-2" (click)="savePolygon()">
          Guardar poligono
        </button>
      }
    } @else {
      <app-filtros-panel />
    }
  </aside>

  <main class="mapa-centro">
    <div id="map"></div>

    @if (loading()) {
      <div class="mapa-loading">Cargando anotaciones...</div>
    }

    @if (!filtered().length && !loading()) {
      <div class="mapa-empty">No hay anotaciones para los filtros seleccionados</div>
    }
  </main>

  <aside class="panel-der">
    <app-anotacion-detalle [annotation]="selected()" />
  </aside>
</div>
