<div class="demarcacion-panel">
  <h3 class="panel-title">
    {{ tienePoligono() ? 'Editar polígono' : 'Demarcar barrio' }}
  </h3>

  <mat-selection-list [multiple]="false">
    @for (b of barrios(); track b.id_neighborhood) {
      <mat-list-option
        [value]="b"
        [selected]="selected()?.id_neighborhood === b.id_neighborhood"
        (click)="select(b)">
        {{ b.name }}
      </mat-list-option>
    }
  </mat-selection-list>

  @if (selected()) {
    <p class="hint">
      {{ tienePoligono() ? 'Modifica los puntos del polígono existente.' : 'Haz clic en el mapa para agregar puntos.' }}
    </p>
  }
</div>
