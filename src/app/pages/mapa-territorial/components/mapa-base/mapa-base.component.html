<div class="mapa-base-container" (click)="closeLayerPanel()">
  <div class="map-canvas" #mapContainer></div>

  <div class="map-topbar" (click)="$event.stopPropagation()">
    <div class="layer-switcher">
      <button type="button" class="layer-toggle-btn" (click)="toggleLayerPanel()">
        <span class="layer-emoji">{{ activeLayer().emoji }}</span>
        <span class="layer-name">{{ activeLayer().label }}</span>
        <svg class="chevron" [class.open]="layerPanelOpen()" viewBox="0 0 16 16">
          <path d="M4 6l4 4 4-4" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/>
        </svg>
      </button>

      @if (layerPanelOpen()) {
        <div class="layer-panel">
          <p class="layer-panel-title">Estilo del mapa</p>
          <div class="layer-grid">
            @for (layer of layers(); track layer.id) {
              <button
                type="button"
                class="layer-item"
                [class.active]="activeLayer().id === layer.id"
                (click)="setLayer(layer)">
                <span class="layer-thumb" [style.background]="layer.previewGradient">
                  @if (activeLayer().id === layer.id) {
                    <span class="layer-check">✓</span>
                  }
                </span>
                <span class="layer-item-name">{{ layer.emoji }} {{ layer.label }}</span>
              </button>
            }
          </div>
        </div>
      }
    </div>

    <div class="topbar-info">
      <span class="info-pill">Zoom {{ zoomLevel() }}</span>
      <span class="info-pill">{{ coords().lat }}, {{ coords().lng }}</span>
    </div>
  </div>

  <div class="map-controls">
    <div class="ctrl-group">
      <button type="button" class="ctrl-btn" (click)="zoomIn()" title="Acercar">
        <svg viewBox="0 0 20 20" fill="currentColor"><path d="M10 4a1 1 0 011 1v4h4a1 1 0 110 2h-4v4a1 1 0 11-2 0v-4H5a1 1 0 110-2h4V5a1 1 0 011-1z"/></svg>
      </button>
      <div class="zoom-track">
        <div class="zoom-fill" [style.height.%]="zoomPercent()"></div>
      </div>
      <button type="button" class="ctrl-btn" (click)="zoomOut()" title="Alejar">
        <svg viewBox="0 0 20 20" fill="currentColor"><path d="M4 10a1 1 0 011-1h10a1 1 0 110 2H5a1 1 0 01-1-1z"/></svg>
      </button>
    </div>

    @if (showLocateControl()) {
      <div class="ctrl-group">
        <button type="button" class="ctrl-btn" [class.active]="locating()" (click)="locateMe()" title="Mi ubicación">
          @if (locating()) {
            <svg class="spin" viewBox="0 0 20 20" fill="currentColor"><path d="M10 2a8 8 0 100 16A8 8 0 0010 2zm0 2a6 6 0 010 12A6 6 0 0110 4z" opacity=".3"/><path d="M10 2a8 8 0 018 8h-2a6 6 0 00-6-6V2z"/></svg>
          } @else {
            <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M5.05 4.05a7 7 0 119.9 9.9L10 18.9l-4.95-4.95a7 7 0 010-9.9zM10 11a2 2 0 100-4 2 2 0 000 4z" clip-rule="evenodd"/></svg>
          }
        </button>
      </div>
    }

    <div class="ctrl-group">
      <button type="button" class="ctrl-btn" (click)="toggleFullscreen()" [title]="isFullscreen() ? 'Salir de pantalla completa' : 'Pantalla completa'">
        @if (isFullscreen()) {
          <svg viewBox="0 0 20 20" fill="currentColor"><path d="M4 8V4h4V2H2v6h2zm0 4H2v6h6v-2H4v-4zm12-4h2V2h-6v2h4v4zm0 4v4h-4v2h6v-6h-2z"/></svg>
        } @else {
          <svg viewBox="0 0 20 20" fill="currentColor"><path d="M3 3h5V1H1v7h2V3zm9-2v2h5v5h2V1h-7zm2 14h-5v2h7v-7h-2v5zM3 12H1v7h7v-2H3v-5z"/></svg>
        }
      </button>
    </div>

    <div class="ctrl-group north-group">
      <div class="north-arrow" title="Norte">
        <svg viewBox="0 0 40 40" xmlns="http://www.w3.org/2000/svg">
          <circle cx="20" cy="20" r="18" fill="white" stroke="#e2e8f0" stroke-width="1.5"/>
          <polygon points="20,5 24,22 20,19 16,22" fill="#ef4444"/>
          <polygon points="20,35 24,18 20,21 16,18" fill="#94a3b8"/>
          <circle cx="20" cy="20" r="2.5" fill="white" stroke="#e2e8f0" stroke-width="1"/>
          <text x="20" y="14" text-anchor="middle" font-size="5.5" font-weight="800" fill="#ef4444" font-family="sans-serif">N</text>
        </svg>
      </div>
    </div>
  </div>
</div>
