<div class="p-6">
  <div class="flex items-center justify-between mb-6">
    <div>
      <h1 class="text-2xl font-bold">Barrios</h1>
      <p class="text-sm text-muted">Unidades territoriales por comuna</p>
    </div>
    <a mat-flat-button color="primary" routerLink="nuevo">
      <mat-icon>add</mat-icon> Nuevo barrio
    </a>
  </div>

  @if (loading()) {
    <mat-progress-bar mode="indeterminate"></mat-progress-bar>
  }

  <mat-card class="cardWithShadow">
    <mat-card-content class="overflow-auto">
      <table mat-table [dataSource]="neighborhoods()" class="w-full">

        <ng-container matColumnDef="name">
          <th mat-header-cell *matHeaderCellDef>Nombre</th>
          <td mat-cell *matCellDef="let n" class="font-semibold">{{ n.name }}</td>
        </ng-container>

        <ng-container matColumnDef="commune">
          <th mat-header-cell *matHeaderCellDef>Comuna</th>
          <td mat-cell *matCellDef="let n">{{ communeName(n.id_commune) }}</td>
        </ng-container>

        <ng-container matColumnDef="status">
          <th mat-header-cell *matHeaderCellDef>Estado</th>
          <td mat-cell *matCellDef="let n">
            <span class="px-2 py-1 rounded-full text-xs font-bold"
              [class.bg-light-success]="n.status==='active'"
              [class.text-success]="n.status==='active'"
              [class.bg-light-error]="n.status!=='active'"
              [class.text-error]="n.status!=='active'">
              {{ n.status }}
            </span>
          </td>
        </ng-container>

        <ng-container matColumnDef="actions">
          <th mat-header-cell *matHeaderCellDef></th>
          <td mat-cell *matCellDef="let n">
            <a mat-icon-button [routerLink]="[n.id_neighborhood, 'editar']" matTooltip="Editar">
              <mat-icon>edit</mat-icon>
            </a>
            <button mat-icon-button color="warn" (click)="openDelete(n)" matTooltip="Eliminar">
              <mat-icon>delete</mat-icon>
            </button>
          </td>
        </ng-container>

        <tr mat-header-row *matHeaderRowDef="columns"></tr>
        <tr mat-row *matRowDef="let row; columns: columns"></tr>
      </table>

      @if (!loading() && !neighborhoods().length) {
        <p class="text-center text-muted py-8">No hay barrios registrados.</p>
      }
    </mat-card-content>
  </mat-card>
</div>
