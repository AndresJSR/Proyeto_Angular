<div class="p-6 max-w-2xl mx-auto">
  <h1 class="text-2xl font-bold mb-6">{{ editId() ? 'Editar' : 'Nueva' }} entidad</h1>

  <mat-card class="cardWithShadow">
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">

        <!-- Logo -->
        <div class="flex items-center gap-4">
          @if (preview()) {
            <img [src]="preview()" class="w-20 h-20 object-contain rounded border" />
          } @else {
            <div class="w-20 h-20 bg-light flex items-center justify-center rounded border">
              <mat-icon>business</mat-icon>
            </div>
          }
          <label>
            <input type="file" accept="image/*" hidden (change)="onFile($event)" />
            <button mat-stroked-button type="button"
              onclick="this.previousElementSibling.click()">
              <mat-icon>upload</mat-icon> Logo
            </button>
          </label>
        </div>

        <mat-form-field appearance="outline">
          <mat-label>Nombre *</mat-label>
          <input matInput formControlName="name" />
        </mat-form-field>

        <div class="grid grid-cols-2 gap-4">
          <mat-form-field appearance="outline">
            <mat-label>NIT *</mat-label>
            <input matInput formControlName="nit" />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Teléfono</mat-label>
            <input matInput formControlName="phone" />
          </mat-form-field>
        </div>

        <mat-form-field appearance="outline">
          <mat-label>Correo electrónico *</mat-label>
          <input matInput formControlName="email" type="email" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Dirección</mat-label>
          <input matInput formControlName="address" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Estado</mat-label>
          <mat-select formControlName="status">
            <mat-option value="active">Activo</mat-option>
            <mat-option value="inactive">Inactivo</mat-option>
          </mat-select>
        </mat-form-field>

        <div class="flex justify-end gap-3">
          <a mat-stroked-button routerLink="/gestion-institucional/entidades">Cancelar</a>
          <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || saving()">
            {{ saving() ? 'Guardando...' : 'Guardar' }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
