<div class="p-6 max-w-2xl mx-auto">
  <h1 class="text-2xl font-bold mb-6">
    {{ editId() ? 'Editar' : 'Nueva' }} {{ isSub() ? 'subcategoría' : 'categoría' }}
  </h1>

  <mat-card class="cardWithShadow">
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">

        <!-- Imagen (solo categorías raíz) -->
        @if (!isSub()) {
          <div class="flex items-center gap-4">
            @if (preview()) {
              <img [src]="preview()" class="w-20 h-20 object-contain rounded border" />
            } @else {
              <div class="w-20 h-20 bg-light flex items-center justify-center rounded border">
                <mat-icon>category</mat-icon>
              </div>
            }
            <label>
              <input type="file" accept="image/*" hidden (change)="onFile($event)" />
              <button mat-stroked-button type="button"
                onclick="this.previousElementSibling.click()">
                <mat-icon>upload</mat-icon> Imagen
              </button>
            </label>
          </div>
        }

        <!-- Categoría padre (solo subcategorías) -->
        @if (isSub()) {
          <mat-form-field appearance="outline">
            <mat-label>Categoría padre *</mat-label>
            <mat-select formControlName="id_parent_category">
              @for (r of roots(); track r.id_category) {
                <mat-option [value]="r.id_category">{{ r.name }}</mat-option>
              }
            </mat-select>
          </mat-form-field>
        }

        <mat-form-field appearance="outline">
          <mat-label>Nombre *</mat-label>
          <input matInput formControlName="name" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Descripción</mat-label>
          <textarea matInput formControlName="description" rows="3"></textarea>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Estado</mat-label>
          <mat-select formControlName="status">
            <mat-option value="active">Activo</mat-option>
            <mat-option value="inactive">Inactivo</mat-option>
          </mat-select>
        </mat-form-field>

        <div class="flex justify-end gap-3">
          <a mat-stroked-button [routerLink]="backRoute">Cancelar</a>
          <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || saving()">
            {{ saving() ? 'Guardando...' : 'Guardar' }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
