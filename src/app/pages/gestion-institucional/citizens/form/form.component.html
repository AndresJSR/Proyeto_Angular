<div class="p-6 max-w-3xl mx-auto">
  <h1 class="text-2xl font-bold mb-6">{{ editId() ? 'Editar' : 'Nuevo' }} ciudadano</h1>

  <mat-card class="cardWithShadow">
    <mat-card-content>
      <form [formGroup]="form" (ngSubmit)="submit()" class="flex flex-col gap-4">

        <mat-form-field appearance="outline">
          <mat-label>Nombre completo *</mat-label>
          <input matInput formControlName="name" />
        </mat-form-field>

        <div class="grid grid-cols-2 gap-4">
          <mat-form-field appearance="outline">
            <mat-label>Correo *</mat-label>
            <input matInput formControlName="email" type="email" />
          </mat-form-field>

          <mat-form-field appearance="outline">
            <mat-label>Celular</mat-label>
            <input matInput formControlName="phone" />
          </mat-form-field>
        </div>

        <mat-form-field appearance="outline">
          <mat-label>Dirección</mat-label>
          <input matInput formControlName="address" />
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Estado</mat-label>
          <mat-select formControlName="status">
            <mat-option value="active">Activo</mat-option>
            <mat-option value="inactive">Inactivo</mat-option>
          </mat-select>
        </mat-form-field>

        <!-- Mapa -->
        <div>
          <p class="text-sm font-semibold mb-1">Ubicación</p>
          <p class="text-xs text-muted mb-2">Haz clic en el mapa para fijar la posición, o usa el botón de ubicación actual.</p>
          <div style="height:380px;border-radius:8px;overflow:hidden;border:1px solid var(--mat-sys-outline-variant);">
            <app-mapa-base
              (mapReady)="onMapReady($event)"
              (mapClick)="onMapClick($event)" />
          </div>
          <div class="flex gap-4 mt-3">
            <mat-form-field appearance="outline" class="flex-1">
              <mat-label>Latitud</mat-label>
              <mat-icon matPrefix>place</mat-icon>
              <input matInput formControlName="latitude" readonly />
            </mat-form-field>
            <mat-form-field appearance="outline" class="flex-1">
              <mat-label>Longitud</mat-label>
              <mat-icon matPrefix>place</mat-icon>
              <input matInput formControlName="longitude" readonly />
            </mat-form-field>
          </div>
        </div>

        <div class="flex justify-end gap-3">
          <a mat-stroked-button routerLink="/gestion-institucional/ciudadanos">Cancelar</a>
          <button mat-flat-button color="primary" type="submit" [disabled]="form.invalid || saving()">
            {{ saving() ? 'Guardando...' : 'Guardar' }}
          </button>
        </div>
      </form>
    </mat-card-content>
  </mat-card>
</div>
