<div class="flex h-screen w-full items-center justify-center overflow-hidden p-2">
  <mat-card class="cardWithShadow overflow-hidden auth-card mx-auto mb-0">
    <div class="grid grid-cols-12 gap-6">
      <div class="lg:col-span-6 col-span-12 flex items-stretch">
        <div class="w-full p-10 flex flex-col justify-center aling-center">
          <div class="text-center mb-8">
            <h2 class="text-2xl font-semibold mb-2">Iniciar sesión</h2>
            <p class="text-sm text-gray-500">
              Sistema de valoración territorial
            </p>
          </div>

          @if (error) {
            <div class="text-red-600 text-sm mb-4 text-center">
              {{ error }}
            </div>
          }

          <div class="flex flex-col gap-3">
            <button
              type="button"
              mat-stroked-button
              class="w-full"
              [disabled]="loadingProvider !== null"
              (click)="loginWithProvider(authProvider.GOOGLE)"
            >
              @if (isLoading(authProvider.GOOGLE)) {
                Ingresando con Google...
              } @else {
                Continuar con Google
              }
            </button>

            <button
              type="button"
              mat-stroked-button
              class="w-full"
              [disabled]="loadingProvider !== null"
              (click)="loginWithProvider(authProvider.GITHUB)"
            >
              @if (isLoading(authProvider.GITHUB)) {
                Ingresando con GitHub...
              } @else {
                Continuar con GitHub
              }
            </button>
          </div>

          <span class="block font-medium text-center mt-6 text-sm text-gray-500">
            Acceso con Firebase Authentication
          </span>
        </div>
      </div>

      <div class="lg:col-span-6 col-span-12 relative hidden lg:flex justify-center items-stretch bg-light p-5">
        <div class="flex items-center justify-center w-full">
          <img
            src="/assets/images/backgrounds/login-bg.svg"
            alt="login"
            class="img-fluid object-cover"
          />
        </div>
      </div>
    </div>
  </mat-card>
</div>
