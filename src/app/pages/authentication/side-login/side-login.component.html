<div class="d-flex align-items-center justify-content-center h-100">
  <mat-card class="w-100" style="max-width: 420px;">
    <mat-card-content>
      <div class="text-center m-b-24">
        <h2 class="m-0">Iniciar sesión</h2>
        <p class="m-t-8 text-muted">
          Accede al sistema de valoración territorial
        </p>
      </div>

      <div class="d-flex flex-column gap-12">
        <button
          mat-stroked-button
          color="primary"
          class="w-100"
          type="button"
          [disabled]="loading"
          (click)="loginWithProvider(AuthProvider.GOOGLE)"
        >
          <span *ngIf="!isLoadingProvider(AuthProvider.GOOGLE)">
            Iniciar sesión con Google
          </span>
          <span *ngIf="isLoadingProvider(AuthProvider.GOOGLE)">
            Conectando con Google...
          </span>
        </button>

        <button
          mat-stroked-button
          color="primary"
          class="w-100"
          type="button"
          [disabled]="loading"
          (click)="loginWithProvider(AuthProvider.MICROSOFT)"
        >
          <span *ngIf="!isLoadingProvider(AuthProvider.MICROSOFT)">
            Iniciar sesión con Microsoft
          </span>
          <span *ngIf="isLoadingProvider(AuthProvider.MICROSOFT)">
            Conectando con Microsoft...
          </span>
        </button>

        <button
          mat-stroked-button
          color="primary"
          class="w-100"
          type="button"
          [disabled]="loading"
          (click)="loginWithProvider(AuthProvider.GITHUB)"
        >
          <span *ngIf="!isLoadingProvider(AuthProvider.GITHUB)">
            Iniciar sesión con GitHub
          </span>
          <span *ngIf="isLoadingProvider(AuthProvider.GITHUB)">
            Conectando con GitHub...
          </span>
        </button>
      </div>

      <div *ngIf="error" class="m-t-16">
        <mat-error>
          {{ error }}
        </mat-error>
      </div>

      <div class="m-t-24 text-center">
        <small class="text-muted">
          El acceso está disponible para administradores, funcionarios y ciudadanos.
        </small>
      </div>
    </mat-card-content>
  </mat-card>
</div>
