<div class="p-24">
  <div class="m-b-16">
    <h2 class="m-0">Reportes inteligentes</h2>
    <p class="m-t-8">
      Escribe una consulta y el sistema generará un gráfico con la respuesta.
    </p>
  </div>

  <div class="d-flex gap-12 m-b-24">
    <input
      type="text"
      [(ngModel)]="query"
      placeholder="Ej: comuna con mas barrios"
      style="width: 100%; padding: 10px;"
    />

    <button type="button" (click)="generateReport()" [disabled]="loading">
      {{ loading ? 'Generando...' : 'Generar reporte' }}
    </button>
  </div>

  <div *ngIf="error" style="color: #c62828; margin-bottom: 16px;">
    {{ error }}
  </div>

  <apx-chart
    *ngIf="chartOptions.series"
    [series]="chartOptions.series!"
    [chart]="chartOptions.chart!"
    [xaxis]="chartOptions.xaxis!"
    [yaxis]="chartOptions.yaxis!"
    [title]="chartOptions.title!"
    [subtitle]="chartOptions.subtitle!"
    [plotOptions]="chartOptions.plotOptions!"
    [dataLabels]="chartOptions.dataLabels!"
    [tooltip]="chartOptions.tooltip!"
    [legend]="chartOptions.legend!"
    [grid]="chartOptions.grid!"
  ></apx-chart>
</div>
